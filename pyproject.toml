[project]
name = "catalyst-surface-agent"
version = "0.1.0"
description = "Autonomous semantic event-convexity research agent."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "exchange-calendars>=4.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scipy>=1.17.1",
    "streamlit>=1.57.0",
    "yfinance>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[dependency-groups]
dev = ["pytest>=9.1.1", "reportlab>=5.0.1", "alpaca-py>=0.43.4",
       "fastapi>=0.136.3", "jinja2>=3.1.6", "pyarrow>=24.0.0",
       "praw>=7.8.1", "pyyaml>=6.0.3"]

[project.optional-dependencies]
portfolio = [
    "alpaca-py>=0.43.4",
    "exchange-calendars>=4.11.2",
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "pyarrow>=24.0.0",
    "praw>=7.8.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.48.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
